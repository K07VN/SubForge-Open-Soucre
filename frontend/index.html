<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self' http://localhost:* http://127.0.0.1:*; img-src 'self' data: blob: http://localhost:* http://127.0.0.1:*; media-src 'self' data: blob: http://localhost:* http://127.0.0.1:*;" />
    <title>SubForge Local</title>
    <script src="./src/local-mode.js" defer></script>
    <!-- Chủ đề tối TRƯỚC khi React chạy: đọc lựa chọn đã lưu (zustand persist "subforge-settings") rồi tô nền + class dark
         ngay ở khung đầu — không thì trang trắng ~1 khung rồi mới tối (người dùng chủ đề tối thấy nháy trắng lúc mở app). -->
    <script>
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem("subforge-settings") || "{}");
          if (s && s.state && s.state.theme === "dark") {
            document.documentElement.classList.add("dark");
            document.documentElement.style.backgroundColor = "#0a0a0a";
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" crossorigin src="./src/app.js"></script>
    <link rel="stylesheet" crossorigin href="./src/styles.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
